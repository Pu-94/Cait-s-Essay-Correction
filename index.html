<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pollinations AI - 作文批改助手</title>
    <style>
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            max-width: 900px;
            margin: 50px auto;
            padding: 20px;
            background: #f0f7ff;
        }
        .login-container, .app-container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .login-container {
            text-align: center;
        }
        input, button, textarea {
            padding: 12px;
            margin: 10px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #ddd;
        }
        input {
            width: 200px;
        }
        textarea {
            width: 90%;
            min-height: 300px;
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            line-height: 1.6;
            resize: vertical;
        }
        button {
            cursor: pointer;
            background: #007bff;
            color: white;
            border: none;
            transition: all 0.3s;
        }
        button:hover {
            background: #0056b3;
            transform: translateY(-2px);
        }
        .mode-selector {
            margin: 20px 0;
            display: flex;
            gap: 15px;
            justify-content: center;
        }
        .mode-btn {
            background: #e0e0e0;
            color: #333;
        }
        .mode-btn.active {
            background: #28a745;
            color: white;
        }
        #output {
            margin-top: 20px;
            padding: 20px;
            background: #f9f9f9;
            border-radius: 10px;
            white-space: pre-wrap;
            text-align: left;
            line-height: 1.8;
            max-height: 500px;
            overflow-y: auto;
        }
        .score-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
        }
        .score-box h3 {
            margin: 0 0 10px 0;
        }
        .score-number {
            font-size: 48px;
            font-weight: bold;
            margin: 10px 0;
        }
        .error {
            color: red;
        }
        .hidden {
            display: none;
        }
        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }
        .essay-label {
            font-weight: bold;
            margin: 15px 0 5px 0;
            color: #333;
        }
    </style>
</head>
<body>
    <!-- 密码登录界面 -->
    <div id="loginPanel" class="login-container">
        <h2>🔐 作文批改助手</h2>
        <p>请输入访问密码</p>
        <input type="password" id="passwordInput" placeholder="密码">
        <button onclick="checkPassword()">进入</button>
        <div id="loginError" class="error"></div>
    </div>

    <!-- 主界面（初始隐藏） -->
    <div id="appPanel" class="app-container hidden">
        <h1>📝 中文作文批改助手</h1>
        <p>你的等级: <strong>Seed</strong> | AI 智能批改，满分50分</p>
        
        <!-- 模式切换 -->
        <div class="mode-selector">
            <button id="essayModeBtn" class="mode-btn active" onclick="setMode('essay')">📝 作文批改模式</button>
            <button id="chatModeBtn" class="mode-btn" onclick="setMode('chat')">💬 普通对话模式</button>
        </div>
        
        <!-- 作文批改界面 -->
        <div id="essayPanel">
            <div class="essay-label">📄 请粘贴或输入作文内容：</div>
            <textarea id="essayInput" placeholder="请在此处粘贴需要批改的作文..."></textarea>
            <button onclick="correctEssay()">🔍 开始批改（满分50分）</button>
        </div>
        
        <!-- 普通对话界面（默认隐藏） -->
        <div id="chatPanel" class="hidden">
            <input type="text" id="prompt" placeholder="输入你的问题..." style="width: 80%;">
            <button onclick="chat()">发送</button>
        </div>
        
        <!-- 输出区域 -->
        <div id="output"></div>
    </div>

    <script>
        // ========== 配置区域 ==========
        const ACCESS_PASSWORD = "Cait-Keyuan";  // 访问密码
        const API_KEY = "sk_VU61A9DADhF23tvvCwEhG3PY4W9OpDv7";  // 你的 sk_ 密钥
        
        let isLoggedIn = false;
        let currentMode = 'essay';  // 'essay' 或 'chat'
        
        // ========== 登录验证 ==========
        function checkPassword() {
            const inputPassword = document.getElementById('passwordInput').value;
            const errorDiv = document.getElementById('loginError');
            
            if (inputPassword === ACCESS_PASSWORD) {
                isLoggedIn = true;
                document.getElementById('loginPanel').classList.add('hidden');
                document.getElementById('appPanel').classList.remove('hidden');
                errorDiv.innerHTML = '';
            } else {
                errorDiv.innerHTML = '密码错误，请重试';
                document.getElementById('passwordInput').value = '';
            }
        }
        
        // ========== 切换模式 ==========
        function setMode(mode) {
            currentMode = mode;
            const essayPanel = document.getElementById('essayPanel');
            const chatPanel = document.getElementById('chatPanel');
            const essayBtn = document.getElementById('essayModeBtn');
            const chatBtn = document.getElementById('chatModeBtn');
            const output = document.getElementById('output');
            
            if (mode === 'essay') {
                essayPanel.classList.remove('hidden');
                chatPanel.classList.add('hidden');
                essayBtn.classList.add('active');
                chatBtn.classList.remove('active');
            } else {
                essayPanel.classList.add('hidden');
                chatPanel.classList.remove('hidden');
                essayBtn.classList.remove('active');
                chatBtn.classList.add('active');
            }
            output.innerHTML = '';  // 清空输出
        }
        
        // ========== 作文批改核心功能 ==========
        async function correctEssay() {
            if (!isLoggedIn) {
                alert('请先登录');
                return;
            }
            
            const essay = document.getElementById('essayInput').value;
            const outputDiv = document.getElementById('output');
            
            if (!essay.trim()) {
                outputDiv.innerHTML = '<span class="error">❌ 请输入作文内容</span>';
                return;
            }
            
            // 显示加载状态
            outputDiv.innerHTML = '<div class="loading">⏳ AI 正在认真批改作文，请稍候...</div>';
            
            // 构建批改提示词
            const correctionPrompt = `你是一位资深的中文教师，请对以下作文进行批改，按照满分50分的标准给出分数和详细评语。

【批改要求】
1. 先给出总分（格式：XX/50分）
2. 从以下维度逐一评分（每个维度满分10分）：
   - 内容立意
   - 结构逻辑  
   - 语言表达
   - 情感感染力
   - 创新亮点
3. 指出作文的优点（至少2点）
4. 指出需要改进的地方（至少2点）
5. 给出具体的修改建议
6. 最后写一段鼓励的话

【作文内容】
${essay}

请用中文回复，格式清晰易读。`;
            
            try {
                const response = await fetch('https://text.pollinations.ai/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${API_KEY}`
                    },
                    body: JSON.stringify({
                        messages: [{ role: 'user', content: correctionPrompt }],
                        model: 'openai',
                        stream: false
                    })
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const result = await response.text();
                
                // 美化输出格式
                let formattedResult = result;
                // 提取分数并高亮显示
                const scoreMatch = result.match(/(\d+(?:\.\d+)?)\s*\/\s*50/);
                if (scoreMatch) {
                    const score = scoreMatch[1];
                    formattedResult = `<div class="score-box">
                        <h3>📊 作文评分结果</h3>
                        <div class="score-number">${score} / 50 分</div>
                    </div>` + result.replace(/(\d+(?:\.\d+)?)\s*\/\s*50/, '');
                } else {
                    formattedResult = `<div class="score-box">
                        <h3>📊 作文批改结果</h3>
                    </div>` + result;
                }
                
                outputDiv.innerHTML = formattedResult;
                
            } catch (error) {
                outputDiv.innerHTML = `<span class="error">❌ 批改失败: ${error.message}<br><br>请检查网络连接或稍后重试。</span>`;
            }
        }
        
        // ========== 普通对话功能 ==========
        async function chat() {
            if (!isLoggedIn) {
                alert('请先登录');
                return;
            }
            
            const prompt = document.getElementById('prompt').value;
            const outputDiv = document.getElementById('output');
            
            if (!prompt.trim()) {
                outputDiv.innerHTML = '<span class="error">请输入内容</span>';
                return;
            }
            
            outputDiv.innerHTML = '<div class="loading">⏳ AI 思考中...</div>';
            
            try {
                const response = await fetch('https://text.pollinations.ai/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${API_KEY}`
                    },
                    body: JSON.stringify({
                        messages: [{ role: 'user', content: prompt }],
                        model: 'openai'
                    })
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                
                const text = await response.text();
                outputDiv.innerHTML = text;
            } catch (error) {
                outputDiv.innerHTML = `<span class="error">❌ 错误: ${error.message}</span>`;
            }
        }
        
        // 回车键发送（对话模式）
        document.getElementById('prompt')?.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') chat();
        });
        
        // 初始化
        console.log('作文批改助手已加载，请登录使用');
    </script>
</body>
</html>
