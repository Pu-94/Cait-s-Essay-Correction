<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pollinations AI - 私密访问</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .login-container, .app-container {
            background: #f5f5f5;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
        }
        input, button {
            padding: 10px;
            margin: 10px;
            font-size: 16px;
        }
        input {
            width: 200px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            cursor: pointer;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
        }
        button:hover {
            background: #0056b3;
        }
        #output {
            margin-top: 20px;
            padding: 15px;
            background: #fff;
            border-radius: 5px;
            white-space: pre-wrap;
            text-align: left;
        }
        .error {
            color: red;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <!-- 密码登录界面 -->
    <div id="loginPanel" class="login-container">
        <h2>🔐 私有 AI 助手</h2>
        <p>请输入访问密码</p>
        <input type="password" id="passwordInput" placeholder="密码">
        <button onclick="checkPassword()">进入</button>
        <div id="loginError" class="error"></div>
    </div>

    <!-- AI 助手主界面（初始隐藏） -->
    <div id="appPanel" class="app-container hidden">
        <h1>✨ Pollinations AI 助手</h1>
        <p>你的等级: <strong>Seed</strong> | 密钥已安全加载</p>
        
        <input type="text" id="prompt" placeholder="输入你的问题..." style="width: 70%;">
        <button onclick="generate()">生成</button>
        
        <div id="output"></div>
    </div>

    <script>
        // ⚠️ 重要：修改这个密码为你自己的！
        const ACCESS_PASSWORD = "Cait-Keyuan";  // 👈 改成你想要的密码
        
        // 你的 sk_ 密钥（只有知道密码的人才能看到页面，然后才能看到这个密钥）
        // 但注意：虽然加了密码锁，懂技术的人还是可能通过开发者工具看到
        // 完全安全需要后端，这是折中方案
        const API_KEY = "sk_VU61A9DADhF23tvvCwEhG3PY4W9OpDv7";  // 👈 改成你的 sk_ 密钥
        
        let isLoggedIn = false;
        
        function checkPassword() {
            const inputPassword = document.getElementById('passwordInput').value;
            const errorDiv = document.getElementById('loginError');
            
            if (inputPassword === ACCESS_PASSWORD) {
                isLoggedIn = true;
                document.getElementById('loginPanel').classList.add('hidden');
                document.getElementById('appPanel').classList.remove('hidden');
                errorDiv.innerHTML = '';
            } else {
                errorDiv.innerHTML = '密码错误，请重试';
                document.getElementById('passwordInput').value = '';
            }
        }
        
        async function generate() {
            if (!isLoggedIn) {
                alert('请先登录');
                return;
            }
            
            const prompt = document.getElementById('prompt').value;
            const outputDiv = document.getElementById('output');
            
            if (!prompt.trim()) {
                outputDiv.innerHTML = '<span class="error">请输入内容</span>';
                return;
            }
            
            outputDiv.innerHTML = '<span>⏳ AI 思考中...</span>';
            
            try {
                const response = await fetch('https://text.pollinations.ai/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${API_KEY}`
                    },
                    body: JSON.stringify({
                        messages: [{ role: 'user', content: prompt }],
                        model: 'openai'
                    })
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                
                const text = await response.text();
                outputDiv.innerHTML = text;
            } catch (error) {
                outputDiv.innerHTML = `<span class="error">❌ 错误: ${error.message}</span>`;
            }
        }
        
        // 回车键发送
        document.getElementById('prompt')?.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') generate();
        });
    </script>
</body>
</html>
